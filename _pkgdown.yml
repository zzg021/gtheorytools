url: https://zzg021.github.io/gtheorytools/

template:
  bootstrap: 5
  bootswatch: pulse
  math-rendering: katex

home:
  title: Generalizability theory in R
  description: >
    Estimate G-study variance components, plan D studies, and compare
    generalizability and dependability coefficients with gtheorytools.

navbar:
  structure:
    left: [get_started, reference]
    right: [search, github]
  components:
    get_started:
      text: Get started
      href: index.html#quick-start

reference:
  - title: One- and two-facet designs
    desc: >
      Estimate variance components for designs named by keyword, with persons
      as the object of measurement, and compute and compare D studies.
    contents:
      - g_study
      - d_study
      - compare_d_studies
  - title: Designs written as design strings
    desc: >
      The same steps for any number of crossed and nested facets and any
      object of measurement.
    contents:
      - g_study_general
      - d_study_general
      - compare_d_studies_general
  - title: Study planning
    desc: Select candidate designs that meet a coefficient target.
    contents:
      - find_d_designs
  - title: Example data
    desc: Synthetic data sets from Brennan (2001).
    contents:
      - brennan_p_x_i
      - brennan_i_in_p
      - brennan_p_x_i_x_o
      - brennan_p_x_r_in_t
      - brennan_i_in_p_unbalanced
      - brennan_p_x_i_in_h_unbalanced
      - brennan_p_x_i_missing
